name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build plans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
            build_tools/requirements/*.txt

      - name: Install quality tools
        run: python -m pip install --upgrade "pip>=25" -r requirements/test.txt

      - name: Validate release metadata
        run: python .github/scripts/release.py metadata

      - name: Compile Python sources
        run: python -m compileall -q build_tools src tests .github/scripts

      - name: Run Ruff
        run: python -m ruff check build_tools src tests .github/scripts

      - name: Run build-system self-test
        run: python build_tools/build.py self-test

      - name: Validate all native build plans
        shell: bash
        run: |
          # v1.6.0 审计注记（已知限制）: 此步骤只做 --dry-run 计划校验；
          # 真实产物 + validate_frozen_runtime 仅在 release.yml 的 Nuitka
          # 路径上运行过。PyInstaller 与 Nuitka 两条路径的产物一致性从未被
          # CI 实证（提高覆盖需要在 CI 增加真实 PyInstaller 构建，属于
          # 后续基础设施投入，见 docs/RELEASE_PROCESS.md）。
          set -euo pipefail
          for target in windows linux macos; do
            for tool in pyinstaller nuitka; do
              python build_tools/build.py \
                --tool "$tool" \
                --target "$target" \
                --profile lite \
                --mode standalone \
                --mpv-runtime system \
                --skip-install \
                --dry-run
            done
          done

  pyright-advisory:
    # v1.6.1: static type feedback without gating. Current error budget is
    # ~480 (dynamic-attribute patterns in main_window/engine dominate);
    # pyright basic resolves the platform facade aliases with zero facade
    # errors, so the report is meaningful even while non-blocking.
    name: Pyright (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/base.txt

      - name: Install type-check inputs
        run: |
          python -m pip install --upgrade "pip>=25" pyright
          python -m pip install PySide6-Essentials==6.11.1 "dbus-next>=0.2.3,<1"

      - name: Run pyright (report only)
        run: python -m pyright --outputjson --level error | tee pyright-report.json || true

      - name: Upload pyright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyright-report
          path: pyright-report.json
          if-no-files-found: ignore

  tests:
    name: Tests (${{ matrix.label }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            target: linux
            arch: x86_64
            python: "3.10"
          - label: Linux x86_64
            os: ubuntu-24.04
            target: linux
            arch: x86_64
            python: "3.13"
          - label: Windows x86_64
            os: windows-latest
            target: windows
            arch: x86_64
            python: "3.10"
          - label: Windows x86_64
            os: windows-latest
            target: windows
            arch: x86_64
            python: "3.13"
          - label: macOS x86_64
            os: macos-15-intel
            target: macos
            arch: x86_64
            python: "3.10"
          - label: macOS arm64
            os: macos-15
            target: macos
            arch: arm64
            python: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/test.txt

      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth python3-tk

      - name: Install test dependencies
        run: python -m pip install --upgrade "pip>=25" -r requirements/test.txt

      - name: Run tests
        run: python -m pytest -q --cov=src --cov=build_tools --cov-report=term
        env:
          # Headless Qt platform plugin: PySide6 tests must actually run on
          # CI runners without a display instead of silently skipping.
          QT_QPA_PLATFORM: offscreen

      - name: Check runtime version entry point
        shell: bash
        run: test "$(python src/main.py --version)" = "$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')"
        env:
          PYTHONPATH: src

      - name: Validate host PyInstaller plan
        run: >-
          python build_tools/build.py
          --tool pyinstaller
          --target ${{ matrix.target }}
          --profile lite
          --mode standalone
          --mpv-runtime system
          --arch ${{ matrix.arch }}
          --skip-install
          --dry-run

      - name: Validate host Nuitka plan
        run: >-
          python build_tools/build.py
          --tool nuitka
          --target ${{ matrix.target }}
          --profile lite
          --mode standalone
          --mpv-runtime system
          --arch ${{ matrix.arch }}
          --skip-install
          --dry-run
