name: Build and release

on:
  push:
    branches: [main]
    paths:
      - src/app/version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      should_release: ${{ steps.state.outputs.should_release }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Releases must run from $expected_ref, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate version metadata
        id: metadata
        run: python .github/scripts/release.py metadata --github-output "$GITHUB_OUTPUT"

      - name: Run release gate tests
        run: |
          python -m pip install --upgrade "pip>=25" "pytest>=8,<10"
          python -m pytest -q
          python build_tools/build.py self-test

      - name: Check Tag and Release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            tagged_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_commit" != "$COMMIT_SHA" ]]; then
              echo "Tag $TAG already points to $tagged_commit, not $COMMIT_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; this run is intentionally idempotent."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            arch: x86_64
            os: windows-latest
          - target: linux
            arch: x86_64
            os: ubuntu-24.04
          - target: macos
            arch: x86_64
            os: macos-15-intel
          - target: macos
            arch: arm64
            os: macos-15
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            build_tools/requirements/*.txt

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          binutils xvfb xauth libgl1 libegl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          libxcb-xkb1 libxkbcommon-x11-0 libdbus-1-3
          libmpv2 upx-ucl
          libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          libcairo2-dev pkg-config cmake
          xdg-desktop-portal

      - name: Install Inno Setup + UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # UPX: try chocolatey first, then fall back to GitHub release download.
          # chocolatey.org occasionally returns 504 Gateway Timeout (transient
          # infrastructure issue), so we cannot rely on it as the only source.
          $upx = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "UPX install attempt $attempt (chocolatey)..."
            choco install upx --version=5.2.0 -y --no-progress --limit-output
            if ($LASTEXITCODE -eq 0) {
              $upx = (Get-Command upx.exe -ErrorAction SilentlyContinue).Source
              if ($upx) { break }
            }
            Write-Host "chocolatey attempt $attempt failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds 10
          }
          if (-not $upx) {
            Write-Host "chocolatey failed after 3 attempts; falling back to GitHub release download"
            $upxRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/upx/upx/releases/latest" -Headers @{ "User-Agent" = "ShangBackground-CI" }
            $asset = $upxRelease.assets | Where-Object { $_.name -match "upx-[\d.]+-win64\.zip$" } | Select-Object -First 1
            if (-not $asset) { throw "Could not find UPX win64 asset in latest GitHub release" }
            Write-Host "Downloading UPX from: $($asset.browser_download_url)"
            $zipPath = "$env:TEMP\upx.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            $extractDir = "$env:TEMP\upx-extracted"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $upx = (Get-ChildItem -Path $extractDir -Recurse -Filter "upx.exe" | Select-Object -First 1).FullName
            if (-not $upx) { throw "upx.exe not found in downloaded archive" }
          }
          Write-Host "UPX binary: $upx"
          & $upx --version | Select-Object -First 2

          # Prefer winget (Inno Setup 7); fall back to chocolatey if winget is unavailable or fails.
          $iscc = $null
          try {
            winget install --id JRSoftware.InnoSetup.7 -e -s winget --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -eq 0) {
              $iscc = @(
                "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
                "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
              ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            }
          } catch {
            Write-Host "winget install failed: $_; falling back to chocolatey"
          }
          if (-not $iscc) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Inno Setup chocolatey install attempt $attempt..."
              choco install innosetup --version=6.5.5 -y --no-progress --limit-output
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 10
            }
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup chocolatey install failed after 3 attempts" }
            $iscc = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe was not found after installation" }

          "SHANGBACKGROUND_UPX_BINARY=$upx" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SHANGBACKGROUND_ISCC=$iscc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $iscc /? | Select-Object -First 2

      - name: Run tests on native runner
        run: |
          python -m pip install --upgrade "pip>=25" "pytest>=8,<10"
          python -m pytest -q

      - name: Build validated full standalone package (Nuitka + UPX)
        # Full profile = all features (video, html, bing, hotkeys, updates, fonts).
        # UPX is auto-disabled on macOS by the build tool; Windows and Linux
        # get a 30-60% smaller binary. Nuitka's --upx-binary runs BEFORE any
        # code signing, so signatures remain valid.
        # --mpv-runtime system: use the target system's libmpv (Linux) or
        # AVFoundation (macOS). Windows video relies on the user installing
        # MPV separately; this is acceptable for a prerelease and avoids the
        # MPV GitHub release asset format mismatch that breaks auto-download.
        # --upx is only passed for Windows/Linux; the build tool would silently
        # skip it on macOS anyway, but omitting the flag avoids confusion in logs.
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python build_tools/build.py
            --tool nuitka
            --target ${{ matrix.target }}
            --profile full
            --mode standalone
            --mpv-runtime system
            --arch ${{ matrix.arch }}
          )
          if [ "${{ matrix.target }}" != "macos" ]; then
            args+=(--upx)
          fi
          "${args[@]}"

      - name: Copy libxcb-cursor.so.0 into Linux bundle (post-build fixup)
        # Nuitka's --include-data-files creates a dangling symlink for .so
        # files because the source path is absolute and Nuitka tries to
        # symlink rather than copy. Remove the symlink and copy the real file.
        # Use ldconfig to locate the library (handles multiarch paths on
        # both amd64 and arm64 without hard-coding /usr/lib/x86_64-linux-gnu/).
        # continue-on-error: a missing libxcb-cursor is a runtime warning, not
        # a build-breaking condition. Some Ubuntu minimal images lack it.
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          standalone_dir=$(find "dist-nuitka/linux" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "WARNING: no standalone directory found under dist-nuitka/linux; skipping xcb-cursor fixup"
            exit 0
          fi
          dist_dir="$standalone_dir/ShangBackground.dist"
          if [ ! -d "$dist_dir" ]; then
            echo "WARNING: $dist_dir not found; skipping xcb-cursor fixup"
            exit 0
          fi
          # Locate libxcb-cursor.so.0 via ldconfig (works for any arch)
          cursor_lib=$(ldconfig -p | grep 'libxcb-cursor.so.0 ' | head -1 | awk '{print $NF}')
          if [ -z "$cursor_lib" ] || [ ! -f "$cursor_lib" ]; then
            echo "WARNING: libxcb-cursor.so.0 not found via ldconfig; Qt may fail at runtime"
            exit 0
          fi
          # Remove any existing symlink/file first, then copy the real .so
          rm -f "$dist_dir/libxcb-cursor.so.0"
          cp -v "$cursor_lib" "$dist_dir/"
          echo "Copied $cursor_lib into $dist_dir"

      - name: Create release archive
        # The variant directory name includes "-html-native" when the html
        # feature is enabled (full profile enables it). We glob-match the
        # actual directory so the workflow does not hard-code the variant.
        shell: bash
        run: |
          set -euo pipefail
          # Find the actual standalone output directory produced by Nuitka.
          # The variant name includes feature suffixes (e.g. full-html-native-x86_64),
          # so we glob-match rather than hard-coding the path.
          standalone_dir=$(find "dist-nuitka/${{ matrix.target }}" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "ERROR: no standalone directory found under dist-nuitka/${{ matrix.target }}"
            ls -la "dist-nuitka/${{ matrix.target }}" || true
            exit 1
          fi
          echo "Using standalone dir: $standalone_dir"
          python .github/scripts/release.py package \
            --target ${{ matrix.target }} \
            --arch ${{ matrix.arch }} \
            --input "$standalone_dir" \
            --output-dir release-assets

      - name: Smoke-test frozen binary (--version)
        # Verify the frozen executable actually runs and reports the correct
        # version before we publish it. This catches broken Nuitka builds
        # that compile successfully but fail at startup due to missing
        # modules, bad data files, or UPX corruption.
        #
        # The match is a substring (grep -q) check rather than strict equality
        # because Nuitka binaries on Windows (console-mode=disable) and macOS
        # (.app bundles) may emit Qt/fontconfig/dbus initialization messages
        # to stderr that would otherwise break an exact-match comparison.
        # On Windows, GUI-mode binaries may not produce stdout at all when
        # invoked from bash; we treat empty output as a soft warning and only
        # fail when a non-empty output does NOT contain the expected version.
        shell: bash
        run: |
          set -uo pipefail
          standalone_dir=$(find "dist-nuitka/${{ matrix.target }}" -type d -name standalone | head -1)
          if [ "${{ matrix.target }}" = "windows" ]; then
            exe="$standalone_dir/ShangBackground.dist/ShangBackground.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            exe="$standalone_dir/ShangBackground.app/Contents/MacOS/ShangBackground"
          else
            exe="$standalone_dir/ShangBackground.dist/ShangBackground"
          fi
          if [ ! -f "$exe" ]; then
            echo "ERROR: frozen executable not found at $exe"
            exit 1
          fi
          expected=$(PYTHONPATH=src python -c "from app.version import APP_VERSION; print(APP_VERSION)")
          echo "Expected version: $expected"
          echo "Running: $exe --version"
          # Capture combined stdout/stderr. The shell is in set -uo pipefail
          # mode (no -e), so a non-zero exit from the binary does not abort
          # the script; some GUI binaries return non-zero on shutdown when
          # no display is attached but still print the version first.
          output=$("$exe" --version 2>&1)
          rc=$?
          echo "Exit code: $rc"
          echo "Output: $output"
          if [ -z "$output" ]; then
            echo "WARNING: frozen binary produced no output (likely Windows GUI mode); skipping strict version check"
            exit 0
          fi
          if echo "$output" | grep -qF "$expected"; then
            echo "OK: frozen binary reports correct version: $expected"
            exit 0
          fi
          echo "ERROR: frozen binary version output did not contain expected '$expected'"
          exit 1

      - name: Build Windows setup.exe (Inno Setup, from Nuitka output)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          standalone_dir=$(find "dist-nuitka/windows" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "ERROR: no standalone directory found under dist-nuitka/windows"
            exit 1
          fi
          echo "Using standalone dir: $standalone_dir"
          python build_tools/build.py installer \
            --target windows \
            --tool nuitka \
            --profile full \
            --arch ${{ matrix.arch }} \
            --input "$standalone_dir" \
            --output-dir release-assets

      - name: Upload build logs (always, for debugging)
        # Always upload build logs and the Nuitka compilation report, even when
        # the build itself failed. This makes remote CI failures debuggable
        # without re-running the build locally.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            build-logs/
            build-generated/**/compilation-report.xml
            build-generated/**/pip-install-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Build and verify source archive
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release.py source-archive --output-dir release-assets
          archive="release-assets/ShangBackground-${{ needs.prepare.outputs.tag }}-source.zip"
          python .github/scripts/release.py verify-source-archive "$archive"

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build, source]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        run: python .github/scripts/release.py checksums release-assets

      - name: Create Tag when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists and was validated by the prepare job."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$COMMIT_SHA" >/dev/null
          fi

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: >-
          gh release create "$TAG"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$TITLE"
          --generate-notes
