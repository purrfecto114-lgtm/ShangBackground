name: Build and release

on:
  push:
    branches: [main]
    paths:
      - src/app/version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      should_release: ${{ steps.state.outputs.should_release }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Releases must run from $expected_ref, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate version metadata
        id: metadata
        run: python .github/scripts/release.py metadata --github-output "$GITHUB_OUTPUT"

      - name: Install Linux test prerequisites
        # Load-time deps of the PySide6 wheels in requirements/test.txt —
        # absent on bare ubuntu-24.04 runners (v1.6.1 release gate finding:
        # collection-time ImportError "libEGL.so.1: cannot open shared
        # object file" once PySide6 stopped silently skipping). libmpv2 is
        # included so the release gate sees the same libmpv-present
        # environment as the build job's Linux leg (the suite is
        # availability-tolerant either way; proven green on both shapes).
        run: >
          sudo apt-get update && sudo apt-get install --yes
          libegl1 libgl1 libfontconfig1 libdbus-1-3
          libxkbcommon0 libxcb-cursor0 libglib2.0-0 libmpv2

      - name: Run release gate tests
        run: |
          python -m pip install --upgrade "pip>=25" -r requirements/test.txt
          python -m pytest -q
          python build_tools/build.py self-test
        env:
          # Headless Qt platform plugin — same contract as the CI workflow.
          QT_QPA_PLATFORM: offscreen

      - name: Check Tag and Release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            tagged_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_commit" != "$COMMIT_SHA" ]]; then
              echo "Tag $TAG already points to $tagged_commit, not $COMMIT_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; this run is intentionally idempotent."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            arch: x86_64
            os: windows-latest
          - target: linux
            arch: x86_64
            os: ubuntu-24.04
          - target: macos
            arch: x86_64
            os: macos-15-intel
          - target: macos
            arch: arm64
            os: macos-15
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            build_tools/requirements/*.txt

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          binutils xvfb xauth libgl1 libegl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          libxcb-xkb1 libxkbcommon-x11-0 libdbus-1-3
          libmpv2 upx-ucl
          libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          libcairo2-dev pkg-config cmake
          xdg-desktop-portal

      - name: Install Inno Setup + UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Lets the Inno Setup GitHub-release fallback authenticate its
          # api.github.com call (avoids the anonymous 60 req/h limit that is
          # routinely exhausted on shared Azure runner IPs).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # UPX: try chocolatey first, then fall back to GitHub release download.
          # chocolatey.org occasionally returns 504 Gateway Timeout (transient
          # infrastructure issue), so we cannot rely on it as the only source.
          $upx = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "UPX install attempt $attempt (chocolatey)..."
            choco install upx --version=5.2.0 -y --no-progress --limit-output
            if ($LASTEXITCODE -eq 0) {
              $upx = (Get-Command upx.exe -ErrorAction SilentlyContinue).Source
              if ($upx) { break }
            }
            Write-Host "chocolatey attempt $attempt failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds 10
          }
          if (-not $upx) {
            Write-Host "chocolatey failed after 3 attempts; falling back to GitHub release download"
            $upxHeaders = @{ "User-Agent" = "ShangBackground-CI" }
            if ($env:GITHUB_TOKEN) { $upxHeaders["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
            $upxRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/upx/upx/releases/latest" -Headers $upxHeaders
            $asset = $upxRelease.assets | Where-Object { $_.name -match "upx-[\d.]+-win64\.zip$" } | Select-Object -First 1
            if (-not $asset) { throw "Could not find UPX win64 asset in latest GitHub release" }
            Write-Host "Downloading UPX from: $($asset.browser_download_url)"
            $zipPath = "$env:TEMP\upx.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            $extractDir = "$env:TEMP\upx-extracted"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $upx = (Get-ChildItem -Path $extractDir -Recurse -Filter "upx.exe" | Select-Object -First 1).FullName
            if (-not $upx) { throw "upx.exe not found in downloaded archive" }
          }
          Write-Host "UPX binary: $upx"
          & $upx --version | Select-Object -First 2

          # Prefer winget (Inno Setup 7); fall back to the official GitHub
          # release of Inno Setup 7. v1.6.1 fix: the previous chocolatey
          # fallback installed Inno Setup 6.5.5, whose ISCC cannot compile
          # the installer script (it uses the IS7-only ``SetupArchitecture``
          # directive) — whenever the fallback fired, the Windows setup.exe
          # build failed. Both paths now install Inno Setup 7.
          $iscc = $null
          try {
            winget install --id JRSoftware.InnoSetup.7 -e -s winget --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -eq 0) {
              $iscc = @(
                "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
                "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
              ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            }
          } catch {
            Write-Host "winget install failed: $_; falling back to the official Inno Setup 7 GitHub release"
          }
          if (-not $iscc) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Inno Setup 7 GitHub release download attempt $attempt..."
              try {
                $releaseHeaders = @{ "User-Agent" = "ShangBackground-CI" }
                if ($env:GITHUB_TOKEN) {
                  # Authenticated requests get a much higher rate limit than
                  # the anonymous 60/h shared by Azure runner IPs.
                  $releaseHeaders["Authorization"] = "Bearer $env:GITHUB_TOKEN"
                }
                $innoRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/jrsoftware/issrc/releases/latest" -Headers $releaseHeaders
                # Acceptance fix: jrsoftware/issrc release assets are named
                # `innosetup-7.x.y-x64.exe` / `-x86.exe` (verified on real
                # releases). Prefer x64; the suffix-less pattern is only a
                # defensive fallback for hypothetical future renames.
                $asset = $innoRelease.assets |
                  Where-Object { $_.name -match '^innosetup-7\.[0-9.]+-x64\.exe$' } |
                  Select-Object -First 1
                if (-not $asset) {
                  $asset = $innoRelease.assets |
                    Where-Object { $_.name -match '^innosetup-7\.[0-9.]+\.exe$' } |
                    Select-Object -First 1
                }
                if (-not $asset) { throw "Could not find an innosetup-7.x(-x64)?.exe asset in the latest jrsoftware/issrc release" }
                Write-Host "Downloading Inno Setup from: $($asset.browser_download_url)"
                $installerPath = "$env:TEMP\innosetup-7.exe"
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installerPath
                # Official silent install flags for innosetup-*.exe (Inno Setup
                # installer itself supports /VERYSILENT /SUPPRESSMSGBOXES).
                $proc = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
                if ($proc.ExitCode -ne 0) { throw "Inno Setup 7 installer exited with code $($proc.ExitCode)" }
                break
              } catch {
                Write-Host "Inno Setup 7 download/install attempt $attempt failed: $_"
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds 10
              }
            }
            $iscc = @(
              "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe was not found after installation" }

          "SHANGBACKGROUND_UPX_BINARY=$upx" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SHANGBACKGROUND_ISCC=$iscc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $iscc /? | Select-Object -First 2

      - name: Run tests on native runner
        run: |
          python -m pip install --upgrade "pip>=25" -r requirements/test.txt
          python -m pytest -q
        env:
          # Headless Qt platform plugin — same contract as the CI workflow.
          # Without it, build_verification._qt_smoke_test's widget.show()
          # aborts the process (SIGABRT, uncatchable from Python) on the
          # Linux build runner's default xcb platform with no X server.
          QT_QPA_PLATFORM: offscreen

      - name: Download verified MPV runtime (Windows)
        # v1.6.2: bundle a verified mpv.exe into the Windows release so video
        # wallpapers work out of the box — v1.6.1 and earlier shipped
        # --mpv-runtime system and required every user to install MPV
        # manually. The stale v1.5-era "MPV release asset format mismatch"
        # note is obsolete: mpv's stable release publishes
        # mpv-v0.41.0-x86_64-pc-windows-msvc.zip which matches the
        # downloader's pinned patterns, and GitHub now serves a per-asset
        # SHA-256 digest that the downloader verifies in addition to this
        # explicit pin (verified end-to-end in the build sandbox: download,
        # wrong-pin exit 2, correct-pin exit 0, mpv verify OK).
        # The pin fails CLOSED when mpv publishes a new stable release —
        # bump the digest consciously after reviewing the release notes
        # (runtime.json records the bundled version and source URL).
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python build_tools/build.py mpv download --target windows --arch x86_64 --channel stable \
            --sha256 4e197f729f5071c6772f35fffd96e0f36e3e8a044bd9479b136bb09b7c6a80ff
          python build_tools/build.py mpv verify --target windows --arch x86_64 --version auto

      - name: Build validated full standalone package (Nuitka + UPX)
        # Full profile = all features (video, html, bing, hotkeys, updates, fonts).
        # UPX is auto-disabled on macOS by the build tool; Windows and Linux
        # get a 30-60% smaller binary. Nuitka's --upx-binary runs BEFORE any
        # code signing, so signatures remain valid.
        # v1.6.2 mpv runtime policy:
        #   - Windows: bundled — the mpv.exe downloaded and verified above is
        #     packaged into bin/mpv (video works out of the box). The real
        #     build hard-fails without a verified runtime (fail-closed).
        #     The payload ships as Nuitka data-files, so UPX never touches
        #     mpv.exe / codec DLLs (UPX-packed mpv is a well-documented
        #     antivirus false-positive magnet).
        #   - Linux: system — the target distribution provides libmpv
        #     (bundling the runner's .so would tie the release to the
        #     build host's glibc).
        #   - macOS: native AVFoundation backend, no mpv involved.
        # --upx is only passed for Windows/Linux; the build tool would silently
        # skip it on macOS anyway, but omitting the flag avoids confusion in logs.
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python build_tools/build.py
            --tool nuitka
            --target ${{ matrix.target }}
            --profile full
            --mode standalone
            --arch ${{ matrix.arch }}
          )
          if [ "${{ matrix.target }}" = "windows" ]; then
            args+=(--mpv-runtime bundled)
          else
            args+=(--mpv-runtime system)
          fi
          if [ "${{ matrix.target }}" != "macos" ]; then
            args+=(--upx)
          fi
          "${args[@]}"

      - name: Copy libxcb-cursor.so.0 into Linux bundle (post-build fixup)
        # Nuitka's --include-data-files creates a dangling symlink for .so
        # files because the source path is absolute and Nuitka tries to
        # symlink rather than copy. Remove the symlink and copy the real file.
        # Use ldconfig to locate the library (handles multiarch paths on
        # both amd64 and arm64 without hard-coding /usr/lib/x86_64-linux-gnu/).
        # continue-on-error: a missing libxcb-cursor is a runtime warning, not
        # a build-breaking condition. Some Ubuntu minimal images lack it.
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          standalone_dir=$(find "dist-nuitka/linux" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "WARNING: no standalone directory found under dist-nuitka/linux; skipping xcb-cursor fixup"
            exit 0
          fi
          dist_dir="$standalone_dir/ShangBackground.dist"
          if [ ! -d "$dist_dir" ]; then
            echo "WARNING: $dist_dir not found; skipping xcb-cursor fixup"
            exit 0
          fi
          # Locate libxcb-cursor.so.0 via ldconfig (works for any arch)
          cursor_lib=$(ldconfig -p | grep 'libxcb-cursor.so.0 ' | head -1 | awk '{print $NF}')
          if [ -z "$cursor_lib" ] || [ ! -f "$cursor_lib" ]; then
            echo "WARNING: libxcb-cursor.so.0 not found via ldconfig; Qt may fail at runtime"
            exit 0
          fi
          # Remove any existing symlink/file first, then copy the real .so
          rm -f "$dist_dir/libxcb-cursor.so.0"
          cp -v "$cursor_lib" "$dist_dir/"
          echo "Copied $cursor_lib into $dist_dir"

      - name: Ad-hoc code sign macOS bundle
        # v1.6.1: unsigned arm64 Mach-O binaries are killed by the macOS
        # kernel on launch (Killed: 9) — ad-hoc signing is REQUIRED for
        # Apple Silicon builds to run at all, and gives x86_64 builds a
        # stable identity. This is NOT notarization: first launch still
        # needs System Settings → Privacy & Security → Open Anyway
        # (documented in README). No trust level changes — only launchability.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          standalone_dir=$(find "dist-nuitka/macos" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "ERROR: no standalone directory found under dist-nuitka/macos"
            exit 1
          fi
          app="$standalone_dir/ShangBackground.app"
          if [ ! -d "$app" ]; then
            echo "WARNING: $app not found; skipping ad-hoc signing"
            exit 0
          fi
          # Sign nested code (dylibs/frameworks) first, then the main
          # executable, then the bundle — --deep alone misses ordering.
          find "$app" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 |
            xargs -0 -r -n1 sh -c 'codesign --force --sign - "$0" || true'
          codesign --force --sign - "$app/Contents/MacOS/ShangBackground"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app" || codesign --verify "$app"
          echo "Ad-hoc signing complete:"
          codesign -dv "$app" 2>&1 | head -3

      - name: Create release archive
        # The variant directory name includes "-html-native" when the html
        # feature is enabled (full profile enables it). We glob-match the
        # actual directory so the workflow does not hard-code the variant.
        shell: bash
        run: |
          set -euo pipefail
          # Find the actual standalone output directory produced by Nuitka.
          # The variant name includes feature suffixes (e.g. full-html-native-x86_64),
          # so we glob-match rather than hard-coding the path.
          standalone_dir=$(find "dist-nuitka/${{ matrix.target }}" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "ERROR: no standalone directory found under dist-nuitka/${{ matrix.target }}"
            ls -la "dist-nuitka/${{ matrix.target }}" || true
            exit 1
          fi
          echo "Using standalone dir: $standalone_dir"
          python .github/scripts/release.py package \
            --target ${{ matrix.target }} \
            --arch ${{ matrix.arch }} \
            --input "$standalone_dir" \
            --output-dir release-assets

      - name: Smoke-test frozen binary (--version)
        # Verify the frozen executable actually runs and reports the correct
        # version before we publish it. This catches broken Nuitka builds
        # that compile successfully but fail at startup due to missing
        # modules, bad data files, or UPX corruption.
        #
        # The match is a substring (grep -q) check rather than strict equality
        # because Nuitka binaries on Windows (console-mode=disable) and macOS
        # (.app bundles) may emit Qt/fontconfig/dbus initialization messages
        # to stderr that would otherwise break an exact-match comparison.
        # On Windows, GUI-mode binaries may not produce stdout at all when
        # invoked from bash; we treat empty output as a soft warning and only
        # fail when a non-empty output does NOT contain the expected version.
        shell: bash
        run: |
          set -uo pipefail
          standalone_dir=$(find "dist-nuitka/${{ matrix.target }}" -type d -name standalone | head -1)
          if [ "${{ matrix.target }}" = "windows" ]; then
            exe="$standalone_dir/ShangBackground.dist/ShangBackground.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            exe="$standalone_dir/ShangBackground.app/Contents/MacOS/ShangBackground"
          else
            exe="$standalone_dir/ShangBackground.dist/ShangBackground"
          fi
          if [ ! -f "$exe" ]; then
            echo "ERROR: frozen executable not found at $exe"
            exit 1
          fi
          expected=$(PYTHONPATH=src python -c "from app.version import APP_VERSION; print(APP_VERSION)")
          echo "Expected version: $expected"
          echo "Running: $exe --version"
          # Capture combined stdout/stderr. The shell is in set -uo pipefail
          # mode (no -e), so a non-zero exit from the binary does not abort
          # the script; some GUI binaries return non-zero on shutdown when
          # no display is attached but still print the version first.
          output=$("$exe" --version 2>&1)
          rc=$?
          echo "Exit code: $rc"
          echo "Output: $output"
          if [ -z "$output" ]; then
            echo "WARNING: frozen binary produced no output (likely Windows GUI mode); skipping strict version check"
            exit 0
          fi
          if echo "$output" | grep -qF "$expected"; then
            echo "OK: frozen binary reports correct version: $expected"
            exit 0
          fi
          echo "ERROR: frozen binary version output did not contain expected '$expected'"
          exit 1

      - name: Build Windows setup.exe (Inno Setup, from Nuitka output)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          standalone_dir=$(find "dist-nuitka/windows" -type d -name standalone | head -1)
          if [ -z "$standalone_dir" ]; then
            echo "ERROR: no standalone directory found under dist-nuitka/windows"
            exit 1
          fi
          echo "Using standalone dir: $standalone_dir"
          python build_tools/build.py installer \
            --target windows \
            --tool nuitka \
            --profile full \
            --arch ${{ matrix.arch }} \
            --input "$standalone_dir" \
            --output-dir release-assets

      - name: Upload build logs (always, for debugging)
        # Always upload build logs and the Nuitka compilation report, even when
        # the build itself failed. This makes remote CI failures debuggable
        # without re-running the build locally.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            build-logs/
            build-generated/**/compilation-report.xml
            build-generated/**/pip-install-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Build and verify source archive
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release.py source-archive --output-dir release-assets
          archive="release-assets/ShangBackground-${{ needs.prepare.outputs.tag }}-source.zip"
          python .github/scripts/release.py verify-source-archive "$archive"

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build, source]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        run: python .github/scripts/release.py checksums release-assets

      - name: Create Tag when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists and was validated by the prepare job."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$COMMIT_SHA" >/dev/null
          fi

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: >-
          gh release create "$TAG"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$TITLE"
          --generate-notes
